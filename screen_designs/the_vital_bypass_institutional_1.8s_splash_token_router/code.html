<style>
    /* Physical Animation Master Sequencing (1.8s Continuous Symphony) */
    :root {
      --easing-spring: cubic-bezier(0.16, 1, 0.3, 1);
      --easing-snap: cubic-bezier(0.87, 0, 0.13, 1);
    }

    /* Canvas Baseline */
    body {
      background-color: #060A12;
      color: #F8FAFC;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      min-height: max(884px, 100dvh);
    }

    /* Micro-dots Initial Row */
    .micro-dot {
      transition: transform 0.28s var(--easing-snap), opacity 0.2s linear, background-color 0.2s, box-shadow 0.2s;
    }

    /* Act I: Skip Spark Vector - perfectly sweeping all 5 dots */
    @keyframes sparkTravel {
      0% { transform: translateX(-76px) scaleX(0.5); opacity: 0; }
      15% { opacity: 1; transform: translateX(-56px) scaleX(1); }
      75% { opacity: 1; transform: translateX(56px) scaleX(1); }
      100% { transform: translateX(76px) scaleX(1.5); opacity: 0; }
    }

    /* Act II: ECG Pulse Morph */
    .ecg-path {
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
    }

    @keyframes drawECG {
      0% { stroke-dashoffset: 200; opacity: 0.3; }
      20% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }

    /* Cross Expansion from Center Lock with Architectural Machined Corners */
    @keyframes crossDeployVertical {
      0% { transform: scaleY(0.08) scaleX(0.7); opacity: 0; }
      40% { opacity: 1; }
      80% { transform: scaleY(1.06) scaleX(1.02); }
      100% { transform: scaleY(1) scaleX(1); opacity: 1; }
    }

    @keyframes crossDeployHorizontal {
      0% { transform: scaleX(0.08) scaleY(0.7); opacity: 0; }
      40% { opacity: 1; }
      80% { transform: scaleX(1.06) scaleY(1.02); }
      100% { transform: scaleX(1) scaleY(1); opacity: 1; }
    }

    /* Center Radiance Flash */
    @keyframes radialDissipate {
      0% { transform: scale(0.2); opacity: 0; }
      45% { opacity: 0.85; }
      100% { transform: scale(3.2); opacity: 0; }
    }

    /* Act IV: Falling Laser Droplet - detaches & shoots downward without pushing layout */
    @keyframes dropletFall {
      0% {
        transform: translateY(0) scaleY(0.3);
        opacity: 0;
      }
      20% {
        opacity: 1;
        transform: translateY(12px) scaleY(1.2);
      }
      80% {
        opacity: 0.9;
        transform: translateY(80px) scaleY(1.5);
      }
      100% {
        transform: translateY(120px) scaleY(0.4);
        opacity: 0;
      }
    }

    /* Bottom Router Ticket Unfold */
    @keyframes passUnfold {
      0% { transform: translateY(108%); opacity: 0; }
      60% { opacity: 1; }
      85% { transform: translateY(-4px); }
      100% { transform: translateY(0); opacity: 1; }
    }

    /* Subdued Pulse for Live Status */
    @keyframes liveBeacon {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.9); }
    }
    .beacon-pulse {
      animation: liveBeacon 2s ease-in-out infinite;
    }

    /* Architectural precision glass bars (machined 7px radii) */
    .glass-pill-vertical {
      background: linear-gradient(180deg, #22C55E 0%, #1E7A46 80%, #14532D 100%);
      box-shadow: 0 0 28px rgba(34, 197, 94, 0.45), inset 0 1px 2px rgba(255, 255, 255, 0.6);
    }
    .glass-pill-horizontal {
      background: linear-gradient(90deg, #38BDF8 0%, #0EA5E9 75%, #0369A1 100%);
      box-shadow: 0 0 28px rgba(14, 165, 233, 0.45), inset 1px 0 2px rgba(255, 255, 255, 0.6);
    }

    /* Specular highlight border for surgical emerald CTA */
    .cta-emerald-surface {
      background: linear-gradient(135deg, #10B981 0%, #059669 45%, #1E7A46 100%);
      border-top: 1px solid rgba(167, 243, 208, 0.45);
      box-shadow: 0 8px 24px -4px rgba(6, 78, 59, 0.65), 0 2px 6px rgba(0, 0, 0, 0.4);
    }
    .cta-emerald-surface:hover {
      background: linear-gradient(135deg, #34D399 0%, #10B981 45%, #047857 100%);
    }
  </style>

<!-- JAVASCRIPT MASTER CHOREOGRAPHY ENGINE (1.8s Unbroken Chain) -->

<script>
    let sequenceTimeouts = [];

    function clearAllSequenceTimeouts() {
      sequenceTimeouts.forEach(id => clearTimeout(id));
      sequenceTimeouts = [];
    }

    function executeChoreography() {
      clearAllSequenceTimeouts();

      // DOM Elements
      const stageAnchor = document.getElementById('stage-anchor');
      const queueDots = document.querySelectorAll('.micro-dot');
      const centerDot = document.getElementById('center-anchor-dot');
      const sparkLine = document.getElementById('spark-line');
      const ecgSvg = document.getElementById('ecg-svg');
      const ecgPath = document.querySelector('.ecg-path');
      const crossAssembly = document.getElementById('cross-assembly');
      const crossVertical = document.getElementById('cross-vertical');
      const crossHorizontal = document.getElementById('cross-horizontal');
      const crossCore = document.getElementById('cross-core');
      const shockwave = document.getElementById('shockwave');
      const ambientRadial = document.getElementById('ambient-radial');
      const textRevealMask = document.getElementById('text-reveal-mask');
      const lightThread = document.getElementById('light-thread');
      const routerDock = document.getElementById('router-dock');
      const dockBeam = document.getElementById('dock-beam');
      const telemetryBar = document.getElementById('cta-telemetry-bar');
      const ctaLabel = document.getElementById('cta-label-text');
      const syncIcon = document.getElementById('sync-icon');

      // Spin sync icon briefly
      syncIcon.classList.add('rotate-180');
      setTimeout(() => syncIcon.classList.remove('rotate-180'), 400);

      // 1. HARD RESET ALL INLINE STYLES & ANIMATIONS
      stageAnchor.style.transform = 'translateY(0)';
      ambientRadial.style.opacity = '0';
      shockwave.style.animation = 'none';
      shockwave.style.opacity = '0';
      shockwave.style.transform = 'scale(0.2)';
      
      textRevealMask.style.transform = 'translateY(100%)';
      textRevealMask.style.opacity = '0';
      
      lightThread.style.animation = 'none';
      lightThread.style.opacity = '0';
      lightThread.style.transform = 'translateY(0) scaleY(0.3)';
      
      routerDock.style.animation = 'none';
      routerDock.style.transform = 'translateY(100%)';
      routerDock.style.opacity = '0';
      
      dockBeam.style.transform = 'translateX(-100%)';
      telemetryBar.style.width = '0%';
      ctaLabel.textContent = 'Proceed to Live Queue';

      sparkLine.style.animation = 'none';
      sparkLine.style.opacity = '0';

      ecgSvg.style.opacity = '0';
      ecgPath.style.animation = 'none';

      crossAssembly.style.opacity = '0';
      crossVertical.style.animation = 'none';
      crossHorizontal.style.animation = 'none';
      crossCore.style.opacity = '0';

      // Reset Dots: indices 0, 1, 3, 4 are outer, index 2 is living center anchor
      queueDots.forEach((dot, idx) => {
        dot.style.transform = 'translateX(0) scale(1)';
        dot.style.opacity = '0.85';
        dot.style.backgroundColor = idx === 2 ? '#64748B' : '#334155';
        dot.style.boxShadow = 'none';
      });

      // 2. FORCE REFLOW ON ALL ANIMATION TARGETS TO GUARANTEE FRESH PLAYBACK
      void sparkLine.offsetWidth;
      void ecgPath.offsetWidth;
      void shockwave.offsetWidth;
      void crossVertical.offsetWidth;
      void crossHorizontal.offsetWidth;
      void lightThread.offsetWidth;
      void routerDock.offsetWidth;
      void centerDot.offsetWidth;

      // ==========================================
      // ACT I (0.0s – 0.42s): "The Skip Vector"
      // Sweep spark perfectly across all five dots
      // ==========================================
      sparkLine.style.animation = 'sparkTravel 0.42s cubic-bezier(0.2, 0, 0.25, 1) forwards';

      // Outer dots translate horizontally into center, center dot scales up to bright emerald anchor
      const t1 = setTimeout(() => {
        queueDots[0].style.transform = 'translateX(48px) scale(0.35)';
        queueDots[0].style.opacity = '0.2';
        queueDots[1].style.transform = 'translateX(24px) scale(0.65)';
        queueDots[1].style.opacity = '0.4';

        queueDots[3].style.transform = 'translateX(-24px) scale(0.65)';
        queueDots[3].style.opacity = '0.4';
        queueDots[4].style.transform = 'translateX(-48px) scale(0.35)';
        queueDots[4].style.opacity = '0.2';

        // Continuous living anchor: center dot turns bright emerald & scales up
        centerDot.style.backgroundColor = '#10B981';
        centerDot.style.boxShadow = '0 0 14px #10B981';
        centerDot.style.transform = 'scale(1.8)';
      }, 150);
      sequenceTimeouts.push(t1);

      // Outer dots finish coalescing into center anchor
      const t2 = setTimeout(() => {
        queueDots[0].style.transform = 'translateX(64px) scale(0)';
        queueDots[0].style.opacity = '0';
        queueDots[1].style.transform = 'translateX(32px) scale(0)';
        queueDots[1].style.opacity = '0';

        queueDots[3].style.transform = 'translateX(-32px) scale(0)';
        queueDots[3].style.opacity = '0';
        queueDots[4].style.transform = 'translateX(-64px) scale(0)';
        queueDots[4].style.opacity = '0';
      }, 340);
      sequenceTimeouts.push(t2);

      // ==========================================
      // ACT II (0.42s – 0.95s): "ECG to Cross"
      // No blackout: living anchor triggers ECG line
      // ==========================================
      const t3 = setTimeout(() => {
        ecgSvg.style.opacity = '1';
        ecgPath.style.animation = 'drawECG 0.45s cubic-bezier(0.25, 1, 0.5, 1) forwards';
      }, 420);
      sequenceTimeouts.push(t3);

      // Peak deflection: smoothly cross-fade ECG as architectural cross capsules expand
      const t4 = setTimeout(() => {
        // Smooth cross-fade (transition: opacity 150ms ease-out)
        ecgSvg.style.opacity = '0';
        crossAssembly.style.opacity = '1';
        
        // Hide the center anchor as the cross fully takes over
        centerDot.style.opacity = '0';

        // Architectural machined cross deployment
        crossVertical.style.animation = 'crossDeployVertical 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards';
        crossHorizontal.style.animation = 'crossDeployHorizontal 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards';

        // Pure white flush core (24x24) luminescence
        crossCore.style.opacity = '1';
        crossCore.style.transition = 'opacity 0.18s ease-in';

        // Fine shockwave dissipation
        shockwave.style.animation = 'radialDissipate 0.65s cubic-bezier(0.1, 0.8, 0.3, 1) forwards';

        // Centered emerald/cyan radial backlight ignition
        ambientRadial.style.opacity = '1';
      }, 800);
      sequenceTimeouts.push(t4);

      // ==========================================
      // ACT III (1.05s – 1.80s): "The Physical Handoff"
      // Smooth upward glide, typography slide, and falling droplet
      // ==========================================
      const t5 = setTimeout(() => {
        stageAnchor.style.transform = 'translateY(-36px)';
        
        // Wordmark and tagline slice up from invisible baseline mask
        textRevealMask.style.transform = 'translateY(0)';
        textRevealMask.style.opacity = '1';

        // Falling laser droplet shoots downward toward the dock
        lightThread.style.animation = 'dropletFall 0.42s cubic-bezier(0.4, 0, 0.2, 1) forwards';
      }, 1100);
      sequenceTimeouts.push(t5);

      // Droplet impact: bottom Router Dock unfolds upward and top beam splits
      const t6 = setTimeout(() => {
        routerDock.style.animation = 'passUnfold 0.52s cubic-bezier(0.16, 1, 0.3, 1) forwards';
        
        // Exact millisecond split for horizontal beam
        const t7 = setTimeout(() => {
          dockBeam.style.transform = 'translateX(0)';
          
          // Subdued auto-route telemetry bar animation
          telemetryBar.style.width = '100%';
        }, 220);
        sequenceTimeouts.push(t7);

      }, 1320);
      sequenceTimeouts.push(t6);
    }

    // Interactive routing trigger for prototype evaluation
    function triggerDestination(target) {
      const ctaLabel = document.getElementById('cta-label-text');
      const ctaIcon = document.getElementById('cta-icon');
      const telemetryBar = document.getElementById('cta-telemetry-bar');

      telemetryBar.style.transitionDuration = '400ms';
      telemetryBar.style.width = '100%';
      ctaIcon.textContent = 'hourglass_empty';
      ctaIcon.classList.add('animate-spin');
      ctaLabel.textContent = `Connecting to ${target}...`;

      setTimeout(() => {
        ctaIcon.classList.remove('animate-spin');
        ctaIcon.textContent = 'check_circle';
        ctaLabel.textContent = 'FastTrack Gate Verified';
      }, 650);
    }

    // Auto-boot sequence on load & bind replay
    window.addEventListener('DOMContentLoaded', () => {
      executeChoreography();
      document.getElementById('replay-btn').addEventListener('click', executeChoreography);
    });
  </script>
</body></html>
